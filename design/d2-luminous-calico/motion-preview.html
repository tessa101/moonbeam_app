function opacity(svg,id,a){const e=item(svg,id);if(e)e.setAttribute('opacity',a)}

function translate(svg,id,x,y){const e=item(svg,id);if(e)e.setAttribute('transform',`translate(${x} ${y})`)}

function apply(svg,mode,t){
 const state=select.value;const wave=Math.sin(Math.PI*clamp(t/3.6));
 if(mode==='halo')opacity(svg,'moon-halo',.65+.35*(.5-.5*Math.cos(t*Math.PI/2)));

 if(mode==='search'){const a=t<1?0:t<2?3*ease(t-1):t<3.1?3:t<4.3?3-5*ease((t-3.1)/1.2):t<5?-2:-2+2*ease(t-5);rotate(svg,'look',a,246,397);}
 if(mode==='tilt')rotate(svg,'look',-3.5*wave,602,402);

 if(mode==='glimmer')opacity(svg,'moon-halo',.68+.32*wave);
 if(mode==='arrival'){translate(svg,'foreground',0,4*(1-ease(t/1.2)));opacity(svg,'foreground',.6+.4*ease(t/1.2));}
 if(mode==='route')opacity(svg,'route',1-.28*ease(t/1.5));
 if(mode==='map')rotate(svg,'map',1.4*Math.sin(Math.PI*clamp(t/2.5)),1360,580);

 if(mode==='lock-pulse'){const e=item(svg,'lock');if(e){const s=1+.045*wave;e.setAttribute('transform',`translate(1717 448) scale(${s}) translate(-1717 -448)`);}}
}
function tick(now){elapsed=(now-start)/1000;views.forEach((v,i)=>apply(v,options[select.value][i][2],elapsed));if(elapsed<6&&playing)frame=requestAnimationFrame(tick);else{playing=false;status.textContent='At rest';root.querySelector('#d2-pause').textContent='Resume';}}
