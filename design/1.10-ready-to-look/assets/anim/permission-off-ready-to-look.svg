<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 400 520" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">D2 luminous calico — ready to look (permission off)</title><desc>Layered: moon-halo, moon-disc (same moon as searching.svg), then foreground → breath → tail, body, head → ear. Each cat layer is a transparent raster cut from the D2 ready-to-look art; the layers sum to the full cat.</desc><defs><radialGradient id="rtl-halo"><stop offset="0" stop-color="#EDBA69" stop-opacity=".27"></stop><stop offset=".48" stop-color="#EDBA69" stop-opacity=".17"></stop><stop offset=".75" stop-color="#EDBA69" stop-opacity=".045"></stop><stop offset="1" stop-color="#EDBA69" stop-opacity="0"></stop></radialGradient><radialGradient id="rtl-disc" cx="42%" cy="36%" r="72%"><stop stop-color="#F7E7BD"></stop><stop offset="1" stop-color="#E9CC94"></stop></radialGradient></defs><g transform="translate(-15 -130)"><g data-part="moon"><circle data-part="moon-halo" display="none" cx="230" cy="332" r="222.75" fill="url(#rtl-halo)"></circle><circle data-part="moon-disc" cx="230" cy="332" r="135" fill="url(#rtl-disc)"></circle></g></g><g data-part="foreground" transform="translate(-49.00 27.73) scale(0.415)"><g data-part="breath"><g data-part="tail"><image x="215" y="250" width="800" height="860"></image></g><g data-part="body"><image x="215" y="250" width="800" height="860"></image></g><g data-part="head"><image x="215" y="250" width="800" height="860"></image><g data-part="ear"><image x="215" y="250" width="800" height="860"></image></g></g></g></g></svg>